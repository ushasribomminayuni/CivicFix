
spring.application.name=civicfix

# Temporary H2 database for Render demo
spring.datasource.url=jdbc:h2:file:./data/civicfix
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Server port for Render
server.port=${PORT:8080}

# Admin login credentials from Render environment variables
civicfix.admin.username=${ADMIN_USERNAME:admin}
civicfix.admin.password=${ADMIN_PASSWORD}

# H2 console (for local debugging only)
spring.h2.console.enabled=false
